apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: northstar-web
  namespace: northstar
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: northstar-web
  minReplicas: ${APP_MIN_REPLICAS}
  maxReplicas: ${APP_MAX_REPLICAS}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: ${APP_CPU_TARGET_PERCENT}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 8
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
